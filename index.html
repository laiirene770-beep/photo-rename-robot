<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>照片重新命名機器人 V3.5</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
body{
    font-family:Arial;
    background:#eef5ff;
    margin:0;
    padding:25px;
}
.container{
    max-width:1100px;
    margin:auto;
    background:white;
    border-radius:16px;
    padding:24px;
}
h2{
    text-align:center;
    color:#2563eb;
}
table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}
th,td{
    border:1px solid #ddd;
    padding:8px;
    text-align:center;
}
th{
    background:#2563eb;
    color:white;
}
.preview{
    width:90px;
    height:90px;
    object-fit:cover;
    border-radius:8px;
}
button{
    background:#2563eb;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
}
.status{
    margin-top:15px;
    color:#2563eb;
    font-weight:bold;
}
canvas{display:none;}
</style>
</head>

<body>

<div class="container">

<h2>📷 Photo Rename Robot V3.5</h2>

<input id="files" type="file" multiple accept="image/*">

<button onclick="startOCR()">開始辨識</button>

<div class="status" id="status"></div>

<table>
<thead>
<tr>
<th>圖片</th>
<th>原始檔名</th>
<th>單位</th>
<th>5碼</th>
<th>6碼</th>
<th>新檔名</th>
</tr>
</thead>

<tbody id="resultBody"></tbody>

</table>

<canvas id="canvas"></canvas>

</div>

<script src="imageProcessor.js"></script>
<script src="app.js"></script>

</body>
</html>

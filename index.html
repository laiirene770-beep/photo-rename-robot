<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Photo Rename Robot V5.0</title>

  <link rel="stylesheet" href="style.css">

  <!-- OCR -->
  <script src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"></script>

  <!-- ZIP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <!-- Excel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>

<body>

<div class="container">

  <!-- Header -->
  <header>
    <h1>📷 Photo Rename Robot V5.0</h1>
    <p>輔大設備照片 AI 辨識系統</p>
  </header>

  <!-- 上傳區 -->
  <section class="upload-card">

    <div id="dropZone" class="drop-zone">

      <div class="upload-icon">📁</div>

      <h2>拖曳照片或資料夾到這裡</h2>

      <p>支援 JPG / JPEG / PNG</p>

      <!-- 修正版 -->
      <input
        id="fileInput"
        type="file"
        accept="image/*"
        multiple
        hidden
      >

      <button id="selectBtn">
        選擇照片
      </button>

    </div>

  </section>

  <!-- 進度 -->
  <section class="progress-card">

    <div class="progress-top">
      <span>辨識進度</span>
      <span id="progressText">0%</span>
    </div>

    <div class="progress-bar">
      <div id="progressFill"></div>
    </div>

  </section>

  <!-- 縮圖 -->
  <section class="preview-card">

    <div class="section-title">
      <h2>照片預覽</h2>
      <span id="photoCount">0 張</span>
    </div>

    <div id="previewGrid" class="preview-grid"></div>

  </section>

  <!-- 結果 -->
  <section class="result-card">

    <div class="section-title">
      <h2>辨識結果</h2>
    </div>

    <div class="table-wrapper">

      <table>

        <thead>
          <tr>
            <th>照片</th>
            <th>單位</th>
            <th>定位器</th>
            <th>財產編號</th>
            <th>信心</th>
          </tr>
        </thead>

        <tbody id="resultBody">

          <tr class="empty-row">
            <td colspan="5">尚未載入照片</td>
          </tr>

        </tbody>

      </table>

    </div>

  </section>

  <!-- 按鈕 -->
  <section class="action-card">

    <button id="startBtn" class="primary">
      🔍 開始辨識
    </button>

    <button id="excelBtn" disabled>
      📄 匯出 Excel
    </button>

    <button id="zipBtn" disabled>
      📦 下載 ZIP
    </button>

  </section>

</div>

<!-- Loading -->
<div id="loading" class="loading hidden">

  <div class="spinner"></div>

  <p id="loadingText">
    AI 辨識中...
  </p>

</div>

<!-- JS -->
<script src="validator.js"></script>
<script src="imageProcessor.js"></script>
<script src="ocrEngine.js"></script>
<script src="app.js"></script>

</body>
</html>

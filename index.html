<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>輔大定位器盤點系統 V3.2</title>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    body{
      font-family:Microsoft JhengHei;
      background:#EEF3F8;
      margin:0;
    }

    .wrap{
      max-width:1000px;
      margin:25px auto;
      background:white;
      padding:24px;
      border-radius:14px;
    }

    h1{
      color:#1565C0;
    }

    .toolbar{
      margin:15px 0;
    }

    button{
      background:#1976D2;
      color:white;
      border:none;
      padding:10px 18px;
      border-radius:8px;
      margin-right:8px;
      cursor:pointer;
    }

    .card{
      display:grid;
      grid-template-columns:150px 1fr;
      gap:16px;
      border:1px solid #DDD;
      border-radius:10px;
      padding:12px;
      margin-top:12px;
    }

    img{
      width:150px;
      height:150px;
      object-fit:cover;
      border-radius:8px;
    }

    .row{
      display:flex;
      align-items:center;
      margin:8px 0;
    }

    label{
      width:80px;
      font-weight:bold;
    }

    input{
      flex:1;
      padding:8px;
      border:1px solid #CCC;
      border-radius:6px;
    }

    #status{
      color:#1976D2;
      font-weight:bold;
    }
  </style>
</head>

<body>

<div class="wrap">

<h1>🏥 輔仁大學附設醫院－定位器盤點系統</h1>

<p>
拖曳或選取照片後，按「開始辨識」
</p>

<input
id="files"
type="file"
multiple
accept="image/*">

<div class="toolbar">

<button id="scan">
開始辨識
</button>

<button id="zip">
下載 ZIP
</button>

<button id="excel">
下載 Excel
</button>

</div>

<p id="status">
請選擇照片
</p>

<div id="cards"></div>

</div>

<script type="module" src="app.js"></script>

</body>
</html>

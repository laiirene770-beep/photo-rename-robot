<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>照片重新命名機器人 V3.4</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    background:#eef4ff;
    font-family:Arial,Helvetica,sans-serif;
    padding:30px;
}
.container{
    max-width:900px;
    margin:auto;
    background:#fff;
    border-radius:18px;
    padding:30px;
    box-shadow:0 10px 25px rgba(0,0,0,.1);
}
h1{
    color:#2563eb;
    text-align:center;
}
.upload{
    border:2px dashed #60a5fa;
    padding:35px;
    text-align:center;
    border-radius:15px;
    margin:20px 0;
}
button{
    background:#2563eb;
    color:#fff;
    border:none;
    padding:12px 22px;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
}
button:hover{
    background:#1d4ed8;
}
table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}
th,td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}
th{
    background:#2563eb;
    color:#fff;
}
.status{
    margin-top:15px;
    color:#2563eb;
    font-weight:bold;
}
canvas{
    display:none;
}
</style>

</head>
<body>

<div class="container">

<h1>📷 照片重新命名機器人 V3.4</h1>

<div class="upload">
<input type="file" id="files" multiple accept="image/*">
<p>可一次選擇多張照片</p>
</div>

<button onclick="startOCR()">開始辨識</button>

<div class="status" id="status"></div>

<table>
<thead>
<tr>
<th>原始檔名</th>
<th>單位</th>
<th>5碼</th>
<th>6碼</th>
<th>新檔名</th>
</tr>
</thead>

<tbody id="resultBody"></tbody>

</table>

<canvas id="canvas"></canvas>

</div>

<script src="imageProcessor.js"></script>
<script src="app.js"></script>

</body>
</html>
